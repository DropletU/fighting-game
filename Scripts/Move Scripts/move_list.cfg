; The section names refer to the stance and the action that will be done
; Member sequence refers to the sequence of inputs that need to be done for the action
; Member stance refers to whether this action is purely a stance or not, meaning only
; movement inputs are done
; Member keep_executing_false decides whether the executor should set executing to true
; or not when this action starts. This is mainly for the move [standing/dash_stance]
; Member required refers to whether '(R)' is required for all of the inputs in the 
; sequence that have it
; Member ignore_movement tells the sequence builder to ignore WASD keys while building
; the sequence
; Important: If you wish to add a new value here, you should go to these methods
; after adding the check in the sequences_match method.
; matches_any_sequence(), matches_any_stance(), get_stance(), get_move_name(),
; and find_callable_stance().
; It's unlikely, but just in case, you should also check find_callable_action().
; Lastly, be sure to check whether you actually should add it to them or not.

[standing/dash_stance]
sequence = ["forward(R)", "neutral", "down", "downforward"]
stance = true
keep_executing_false = true

[standing/double_jump_stance]
sequence = ["upthreefour(R)"]

[standing/counter_stance]
sequence = ["back(R)", "neutral"]
stance = true
required = true

[standing/slash_stun]
sequence = ["one", "four(R)", "threefour"]

[standing/stab_stun]
sequence = ["two", "three(R)"]

[standing/explode_stance]
sequence = ["onetwothreefour(R)"]
required = true
keep_executing_false = true


[counter/parry]
sequence = ["threetwo(R)"]

[counter/grapple_to]
sequence = ["threefour(R)"]

[counter/grapple_from]
sequence = ["onetwo(R)"]

[counter/quick_dodge_forward]
sequence = ["forward", "neutral", "forward(R)"]

[counter/quick_dodge_back]
sequence = ["back", "neutral", "back(R)"]



[dash/stab]
sequence = ["forwardone(R)"]

[dash/uppercut]
sequence = ["forwardthreetwo"]

[dash/slash]
sequence = ["forwardonefour"]


[exploding/explode]
sequence = ["onetwothreefour"]
ignore_movement = true


[stab/fivehit]
sequence = ["one(R)", "two(R)", "three(R)", "one(R)", "four(R)"]



[grapple/tenhit]
sequence = ["four", "one(R)", "three", "threefour(R)", "three", "four(R)", "three", "four", "threefour(R)", "four(R)"]
